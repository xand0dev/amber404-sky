[project]
name = "amber-sky-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pyshp>=2.3", "jsonschema>=4.23"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
