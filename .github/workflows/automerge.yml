# Автомерж (docs/PIPELINE.md §5): після зеленого CI на PR, з коду main.
# Мерджить squash-ом, якщо: CI зелений для поточного head, PR не draft, гілка feat/F<N>-…,
# немає спільних файлів (інакше мітка `shared` — зливає чергова F0). Потім запускає deploy.
name: Automerge
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write
jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Decide and merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --state open --head "$HEAD_BRANCH" --base main --json number,headRefOid,isDraft,isCrossRepository --jq '.[0] // empty')
          [ -z "$pr" ] && { echo "No open PR for $HEAD_BRANCH"; exit 0; }
          num=$(jq -r .number <<<"$pr")
          [ "$(jq -r .isCrossRepository <<<"$pr")" = "true" ] && { echo "Fork PR — manual"; exit 0; }
          [ "$(jq -r .headRefOid <<<"$pr")" != "$HEAD_SHA" ] && { echo "Head moved — wait for next CI"; exit 0; }
          [ "$CONCLUSION" = "cancelled" ] && { echo "CI cancelled — newer run will decide"; exit 0; }
          if [ "$CONCLUSION" != "success" ]; then
            gh pr edit "$num" --add-label fix || true
            echo "CI red — label fix for the runner"; exit 0
          fi
          gh pr edit "$num" --remove-label fix 2>/dev/null || true
          [ "$(jq -r .isDraft <<<"$pr")" = "true" ] && { echo "Draft — skip"; exit 0; }
          gh pr diff "$num" --name-only > files.txt
          result=$(node .github/scripts/guard.mjs "$HEAD_BRANCH" < files.txt) || { echo "$result"; exit 1; }
          echo "$result"
          if [ "$(jq '.shared | length' <<<"$result")" != "0" ] || [ "$(jq -r .feature <<<"$result")" = "null" ]; then
            gh pr edit "$num" --add-label shared
            echo "Shared files — waiting for review"; exit 0
          fi
          if ! gh pr merge "$num" --squash --delete-branch; then
            gh pr edit "$num" --add-label fix || true
            echo "Merge failed (conflict?) — label fix"; exit 0
          fi
          gh workflow run deploy.yml --ref main
