# Pages (F0-AC5): збирає дані (справжні, де готові; решта — MOCK) і сайт. Повний make data — лише
# за розкладом або коли дані на Pages старі / неповні (#138); інакше дані з Pages. Мерж токеном workflow
# не породжує push, тому automerge запускає цей workflow явно.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7 */3 * * *'   # дані кожні 3 год (SPEC §5)
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false   # не скасовувати запущений деплой: при частих злиттях сайт інакше не оновлюється (у черзі лишається найновіший)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: astral-sh/setup-uv@v6
      - run: make setup
      - uses: actions/configure-pages@v5
        id: pages
      # #138: push і ручний запуск (automerge) не тягнуть Open-Meteo — беруть поточні дані з Pages,
      # якщо вони не старші за 3 год і всі джерела ok (web/src/core/datasync.ts). Інакше й за розкладом — make data.
      # Профіль (#165) — тека data/profile/ (index.json + h00…h47.json), береться вся, з одного запуску.
      - id: fresh
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: node .github/scripts/pages-data.mjs "${{ steps.pages.outputs.base_url }}" web/public/data
        env:
          EVENT: ${{ github.event_name }}
      - run: make data
        if: github.event_name == 'schedule' || steps.fresh.outputs.stale != 'false'
        env:
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      - run: cd web && npm run schemas && npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
